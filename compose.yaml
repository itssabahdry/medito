name: medito
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medito}
      POSTGRES_USER: ${POSTGRES_USER:-medito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medito}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medito}
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/data/documents
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medito.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_DATA: ${DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    volumes:
      - documents:/app/data/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
volumes:
  postgres_data:
  documents:
